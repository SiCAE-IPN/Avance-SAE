<!-- templates/login.html -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login SiCAE</title>
    <link rel="stylesheet" href="/static/css/fonts.css">
    <link rel="stylesheet" href="/static/css/login.css">
    <link rel="stylesheet" href="/static/css/components/loading_banner.css">
    <script src="/static/js/loading_banner.js"></script>
</head>
<body>
    <div class="page">

        <!-- Brand panel -->
        <aside class="brand-panel">
            <div class="brand-content">

                <div class="emblem">

                    <img
                        src="/static/logos/SICAE.png"
                        alt="Escudo del Instituto Politécnico Nacional"
                        class="escudo"
                        onerror="this.parentElement.classList.add('escudo-missing')">
                </div>

                <h1 class="brand-logo">SiCAE</h1>
                <p class="brand-tagline">Sistema de Captura y Análisis de la Estadística</p>
                
            </div>
        </aside>

        <!-- Form panel -->
        <main class="form-panel">
            <div class="form-card">
                <h2 class="form-title">Iniciar sesión</h2>
                <p class="form-subtitle">Ingresa tus datos para continuar.</p>

                <form method="post" action="/login" class="login-form">
                    <label class="field">
                        <span class="field-label">Usuario</span>
                        <input type="text" name="usuario_email" placeholder="Usuario o correo" required class="input-form">
                    </label>

                    <label class="field">
                        <span class="field-label">Contraseña</span>
                        <div class="password-wrapper">
                            <input id="password" type="password" name="password" placeholder="Contraseña" required class="input-form" autocomplete="current-password">
                            <button type="button" id="togglePassword" class="toggle-eye" aria-label="Mostrar contraseña" title="Mostrar/Ocultar">
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <!-- Ojo abierto -->
                                    <g class="icon-open" style="display:none">
                                        <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </g>
                                    <!-- Ojo cerrado sin diagonal: párpado y pestañas -->
                                    <g class="icon-closed">
                                        <path d="M2 12 C7 8, 17 8, 22 12"></path>
                                        <line x1="6" y1="10" x2="6" y2="8"></line>
                                        <line x1="12" y1="9.5" x2="12" y2="7.5"></line>
                                        <line x1="18" y1="10" x2="18" y2="8"></line>
                                    </g>
                                </svg>
                            </button>
                        </div>
                    </label>

                    <button type="submit" class="btn-submit">Ingresar</button>

                    <div class="recuperacion-links">
                        <a href="/recuperacion/usuario">¿Olvidaste tu usuario?</a>
                        <a href="/recuperacion/password">¿Olvidaste tu contraseña?</a>
                    </div>
                </form>

                {% if mensaje is defined %}
                    <div class="status {{ 'ok' if exito else 'fail' }}">
                        {{ mensaje }}
                    </div>
                {% endif %}
            </div>
        </main>
    </div>

    <script>
        (function(){
            const input = document.getElementById('password');
            const btn = document.getElementById('togglePassword');
            if (input && btn) {
                const openG = btn.querySelector('.icon-open');
                const closedG = btn.querySelector('.icon-closed');
                btn.addEventListener('click', function(){
                    const isHidden = input.type === 'password';
                    input.type = isHidden ? 'text' : 'password';
                    if (openG && closedG) {
                        openG.style.display = isHidden ? 'inline' : 'none';
                        closedG.style.display = isHidden ? 'none' : 'inline';
                    }
                    this.setAttribute('aria-label', isHidden ? 'Ocultar contraseña' : 'Mostrar contraseña');
                });
            }
        })();

        (function () {
            const gear = document.querySelector('.gear');
            if (!gear) return;

            const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

            function applyMotionState() {
                const shouldSpin = !reduceMotion.matches && !document.hidden;
                gear.classList.toggle('spin', shouldSpin);
            }

            applyMotionState();

            // Si el usuario cambia su preferencia de movimiento en el sistema
            reduceMotion.addEventListener('change', applyMotionState);

            // Pausa el giro cuando la pestaña no está visible
            document.addEventListener('visibilitychange', applyMotionState);
        })();
    </script>
</body>
</html>

<!-- Pestaña Programas: formulario de alta, filtros y tabla (todo con IDs prefijados "prog-") -->
<h2>Programas</h2>

<div class="registro-container">
    <h3 id="prog-titulo">Registro Programa</h3>
    <form id="prog-form" autocomplete="off" data-no-loading="true" class="no-loading-banner">
        <div class="form-row">
            <div class="form-group">
                <label for="prog-nombre">Nombre del Programa</label>
                <input type="text" id="prog-nombre" name="nombre" placeholder="Nombre del Programa" maxlength="100" required class="input-form">
            </div>
            <div class="form-group">
                <label for="prog-nivel">Nivel</label>
                <select id="prog-nivel" name="nivel" required class="input-form">
                    <option value="">-- Seleccione un Nivel --</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="prog-rama">Rama</label>
                <select id="prog-rama" name="rama" required class="input-form">
                    <option value="">-- Seleccione una Rama --</option>
                </select>
            </div>
            <div class="form-group">
                <label for="prog-semestre">Semestre</label>
                <select id="prog-semestre" name="semestre" required class="input-form">
                    <option value="">-- Seleccione un Semestre --</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="prog-unidad">Unidad Académica</label>
                <select id="prog-unidad" name="unidad" required class="input-form">
                    <option value="">-- Seleccione una Unidad Académica --</option>
                </select>
            </div>
            <div class="form-group">
                <label for="prog-modalidad">Modalidad</label>
                <select id="prog-modalidad" name="modalidad" required class="input-form">
                    <option value="">-- Seleccione una Modalidad --</option>
                </select>
            </div>
        </div>
        <div class="form-row form-row-actions">
            <button type="submit" id="prog-btn-guardar">Registrar</button>
            <button type="button" id="prog-btn-limpiar">Limpiar</button>
            <button type="button" id="prog-btn-eliminar" style="display:none;">Dar de baja</button>
        </div>
    </form>
    <div id="prog-mensaje" role="status" aria-live="polite"></div>
</div>

<!-- Filtros -->
<div class="filtro-usuarios-box" style="display: flex; gap: 0.5em; align-items: center; flex-wrap: wrap;">
    <input type="text" id="prog-filtro-texto" class="input-form" placeholder="Filtrar por programa, nivel o rama..." aria-label="Filtrar programas" style="min-width: 200px;">
    <select id="prog-filtro-unidad" class="input-form" aria-label="Filtrar por Unidad Académica" style="max-width: 240px;">
        <option value="">Todas las Unidades</option>
    </select>
    <select id="prog-filtro-nivel" class="input-form" aria-label="Filtrar por Nivel" style="max-width: 170px;">
        <option value="">Todos los niveles</option>
    </select>
    <select id="prog-filtro-modalidad" class="input-form" aria-label="Filtrar por Modalidad" style="max-width: 170px;">
        <option value="">Todas las modalidades</option>
    </select>
    <select id="prog-filtro-estatus" class="input-form" aria-label="Filtrar por estatus" style="max-width: 160px;">
        <option value="">Todos los estatus</option>
    </select>
    <button type="button" id="prog-btn-limpiar-filtros" class="btn-filtros" title="Limpiar filtros" style="padding: 0.3em 0.8em;">Borrar Filtros</button>
</div>

<!-- Tabla de programas -->
<div class="table-container">
    <table id="prog-tabla">
        <thead>
            <tr>
                <th>Unidad Académica</th>
                <th>Nombre Programa</th>
                <th>Modalidad</th>
                <th>Nivel</th>
                <th>Rama</th>
                <th>Semestre</th>
                <th>Estatus</th>
            </tr>
        </thead>
        <tbody id="prog-tbody">
            <tr><td colspan="7" class="prog-vacio">Cargando programas…</td></tr>
        </tbody>
    </table>
</div>

<!-- Modal de confirmación de baja -->
<div id="prog-modal-baja" class="modal-overlay">
    <div class="modal-content">
        <div class="modal-icon">⚠️</div>
        <h3 class="modal-title">Confirmar Baja</h3>
        <p class="modal-message">
            ¿Estás seguro que deseas dar de baja el programa <strong id="prog-modal-nombre"></strong>?<br>
            <strong>Esta acción no se podrá revertir desde el sistema.</strong>
        </p>
        <div class="modal-buttons">
            <button type="button" id="prog-modal-confirmar" class="modal-btn modal-btn-confirm">Sí, dar de baja</button>
            <button type="button" id="prog-modal-cancelar" class="modal-btn modal-btn-cancel">Cancelar</button>
        </div>
    </div>
</div>

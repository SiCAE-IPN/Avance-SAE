<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña - SiCAE</title>
  <link rel="stylesheet" href="/static/css/fonts.css">
  <link rel="stylesheet" href="/static/css/recuperar_usuario.css?v={{ range(1, 100000) | random }}">
  <link rel="stylesheet" href="/static/css/components/loading_banner.css">
  <script src="/static/js/loading_banner.js"></script>
  <style>
    body {
      background: linear-gradient(135deg, #750946 60%, #ffffff 100%);
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .auth-box {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 12px 36px rgba(0,0,0,0.2);
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
    }
    .auth-box h2 {
      color: #750946;
      font-size: 1.7rem;
      font-weight: 700;
      margin-top: 0;
      margin-bottom: 28px;
    }
    .form-group {
      text-align: left;
      margin-bottom: 24px;
    }
    .form-group label {
      display: block;
      margin-bottom: 10px;
      font-size: 1rem;
      font-weight: 600;
      color: #333333;
    }
    .form-group input {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid #dbe2ef;
      border-radius: 8px;
      font-size: 1rem;
      background: #f8f9fa;
      box-sizing: border-box;
      transition: all 0.2s ease;
    }
    .form-group input:focus {
      border-color: #750946;
      outline: none;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(117, 9, 70, 0.15);
    }
    .btn-submit {
      width: 100%;
      background: #750946;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      padding: 14px 20px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(117, 9, 70, 0.25);
      transition: all 0.2s ease;
      margin-top: 6px;
      margin-bottom: 18px;
    }
    .btn-submit:hover {
      background: #5a0635;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(117, 9, 70, 0.3);
    }
    .btn-submit:active {
      transform: translateY(0);
    }
    .resultado {
      margin-top: 15px;
      min-height: 24px;
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-word;
    }
    .resultado .ok {
      color: #155724;
      background-color: #d4edda;
      border: 1px solid #c3e6cb;
      padding: 12px 16px;
      border-radius: 8px;
      font-weight: 600;
    }
    .resultado .error {
      color: #721c24;
      background-color: #f8d7da;
      border: 1px solid #f5c6cb;
      padding: 12px 16px;
      border-radius: 8px;
      font-weight: 600;
    }
    .resultado .info {
      color: #0c5460;
      background-color: #d1ecf1;
      border: 1px solid #bee5eb;
      padding: 12px 16px;
      border-radius: 8px;
    }
    .acciones-secundarias {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #e2e8f0;
      font-size: 0.92rem;
    }
    .acciones-secundarias a {
      color: #750946;
      font-weight: 600;
      text-decoration: none;
      margin: 0 8px;
      transition: color 0.2s;
    }
    .acciones-secundarias a:hover {
      color: #2d3a4a;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="auth-box">
    <h2>Recuperar Contraseña</h2>
    <form id="form-recuperar-pass">
      <div class="form-group">
        <label for="email">Correo registrado</label>
        <input type="email" id="email" name="email" required placeholder="correo@ejemplo.com">
      </div>
      <button type="submit" class="btn-submit">Generar nueva contraseña</button>
    </form>
    <div id="resultado" class="resultado"></div>
    <div class="acciones-secundarias">
      <a href="/recuperacion/usuario">¿Olvidaste tu usuario?</a> |
      <a href="/login">Volver al login</a>
    </div>
  </div>
  <script>
    const formRecPass = document.getElementById('form-recuperar-pass');
    formRecPass.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fd = new FormData(formRecPass);
      document.getElementById('resultado').innerHTML = '<p class="info">Procesando solicitud...</p>';
      try {
        const resp = await fetch('/recuperacion/password', { method: 'POST', body: fd });
        const data = await resp.json();
        if (resp.ok) {
          document.getElementById('resultado').innerHTML = `<p class="ok">${data.mensaje}</p>`;
        } else {
          document.getElementById('resultado').innerHTML = `<p class="error">${data.mensaje}</p>`;
        }
      } catch (err) {
        document.getElementById('resultado').innerHTML = `<p class="error">Error de conexión al servidor.</p>`;
      }
    });
  </script>
</body>
</html>
